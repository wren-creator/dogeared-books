title: "My Dad is Now My Mom Too"
summary: "Timmy is eight years old. He loves superheroes, riding his bike, and chocolate chip cookies. And one ordinary evening, his mom sits down on the edge of his bed and tells him something that changes how he sees his family: his dad is becoming his mom, too. Told entirely from Timmy's side of that conversation and the year that follows, picking a new name together at the kitchen table, a nervous first trip to the mall as a family, a hospital stay, a Thanksgiving where he isn't sure the whole family will understand, a beach day where he notices his two moms are starting to look like sisters. He asks the questions a real kid actually asks, gets scared, and gets braver. This isn't a story about a lesson handed down, it's a story about a family finding its way through, together."
