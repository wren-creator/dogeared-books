title: "My Dad is Now My Mom Too"
summary: "Timmy is eight years old, and one ordinary evening his mom sits on the edge of his bed and tells him something that changes how he sees his family: his dad is becoming his mom, too. Told entirely from Timmy's side of the year that follows, a new name picked together at the kitchen table, a nervous first trip to the mall, a Thanksgiving he isn't sure will go well, a beach day where he notices his two moms starting to look like sisters. Honest enough to trust, gentle enough for a good-night read, and written to start a real conversation instead of wrapping one up with a bow."
price: "$5.99"
